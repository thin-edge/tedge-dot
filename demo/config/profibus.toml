# Demo PROFIBUS-DP connector config — pairs with the profibus-sim service in
# ../docker-compose.yaml (Python DP-V0 slave exposed over TCP :9200).
#
# Not shipped in the released package: the packaged binary is built without the
# profibus cargo feature (its serial dependency does not cross-compile yet), so
# this config needs a source-built binary: cargo build --manifest-path impl/rust/Cargo.toml --features profibus
# (Linux only). Copy it to /etc/tedge/plugins/ot/ to run it.
#
# The connector speaks serial-over-TCP to the simulator directly (the sim
# container exposes the slave's serial line on TCP :9200) — no pty or socat
# bridge is needed on the host. Publishes to the thin-edge.io broker on
# 127.0.0.1:1883.
#
# Peripheral layout (matches sim/slave_sim.py defaults):
#   Inputs  (8 bytes): [DI0, DI1, AI0_hi, AI0_lo, AI1_hi, AI1_lo, rsvd, rsvd]
#   Outputs (4 bytes): [DO0, DO1, AO0_hi, AO0_lo]

[connector]
protocol      = "profibus"
service_name  = "tedge-dot-profibus"
poll_interval = "500ms"
log_level     = "info"

# Heartbeat (reporting policy, see doc/reducing-data-volume.md): publish every point at least
# this often, even when its value has not changed, because Cumulocity marks a device unavailable
# when it sends nothing within its required interval; 30m stays inside the usual 60m. A
# heartbeat is always a fresh reading, never a replayed value. It is the point's next poll. A
# polled point without a change filter already publishes every reading, so this matters for
# points you give `on_change`, `deadband`, `min_interval` or `debounce`. Those keys can be set
# here, on a device or on a point; "0" switches an inherited setting off.
report = { max_interval = "30m" }

[mqtt]
host = "127.0.0.1"
port = 1883

[connection]
port           = "tcp://127.0.0.1:9200"
baudrate       = 19200
master_address = 2
slot_bits      = 300

[[device]]
name             = "remote_io"
protocol_address = { station_address = 7, ident_number = 0, input_bytes = 8, output_bytes = 4 }
points_from      = ["demo-sim"]

  # The points come from the packaged point library
  # points.d/profibus/demo-sim.toml (contract §3.4): the simulator's data point
  # list lives there, so this file holds only what is per-instance. An
  # installed package finds it automatically; from a source checkout point the
  # search path at the copy in this repo:
  #
  #   export TEDGE_DOT_POINT_LIBRARY_PATH=demo/points.d
  #
  # A device may still add points of its own, or adjust an inherited one by
  # naming its id and only the fields to change, e.g.:
  #
  #   [[device.point]]
  #   id   = "ai0_raw"
  #   name = "A label of my own"
