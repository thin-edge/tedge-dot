# Demo OPC-UA connector config — pairs with the asyncua simulator
# (opcua-sim in ../docker-compose.yaml, or `just sim opcua`), which advertises
# its endpoint as opc.tcp://127.0.0.1:4840/.
#
# The connector always dials the configured endpoint address, whatever URL the
# server advertises (servers behind NAT or in containers advertise names the
# client cannot reach).
#
# Two ways to use it:
#
#   * Local exploration, no broker needed — the read/write CLI ignores [mqtt].
#     The points come from a packaged library, so from a checkout say where it is
#     once (an installed package needs none of this):
#
#       export TEDGE_DOT_POINT_LIBRARY_PATH=demo/points.d
#       cargo run --manifest-path impl/rust/Cargo.toml -- read  -c demo/config/opcua.toml -d opc1 -p temperature -p count_u32 --json
#       cargo run --manifest-path impl/rust/Cargo.toml -- write -c demo/config/opcua.toml -d opc1 -p setpoint --value 42
#       cargo run --manifest-path impl/rust/Cargo.toml -- read  -c demo/config/opcua.toml -d opc1 -p bad_point  # exits 1 (bad quality)
#
#   * Installed demo — ships with the tedge-dot package in /usr/share/tedge-dot/demo/.
#     Copy it to /etc/tedge/plugins/ot/ and restart tedge-dot.service to run it
#     against the simulator. Publishes to the thin-edge.io broker on 127.0.0.1:1883.
#
# The points map onto the nodes exposed by connectors/opcua/sim/server.py
# (namespace index 2):
#
#   ns=2;s=Temperature   -> float64 21.5    (drifts +/- 2.5 with OPCUA_SIM_DYNAMIC=1, as in the demo stacks)
#   ns=2;s=Count         -> uint32  617001  (increments every second with OPCUA_SIM_DYNAMIC=1)
#   ns=2;s=Setpoint      -> int32   0      (read/write round-trip)
#   ns=2;s=Running       -> bool    false  (read/write round-trip)
#   ns=2;s=DoesNotExist  -> read returns a Bad status -> quality "bad"
#
# With security_policy = "None" no client certificate is needed. The connector
# silences async-opcua's spurious "missing application instance certificate"
# logs by default; set RUST_LOG (e.g. RUST_LOG=info) to see the full client logs.
#
# A SECURED server: `docker compose -f demo/docker-compose.yaml --profile secure up -d
# opcua-secure-sim` starts one on 127.0.0.1:4841 (Basic256Sha256, user
# operator/demo-password). Uncomment the `opc-secure` device below; its first connect
# quarantines the server certificate (link status "certificate untrusted: ...").
# Trust it and the device connects on its next attempt:
#
#   tedge-dot pki list rejected
#   tedge-dot pki trust <first 8 digits of the thumbprint>

[connector]
protocol      = "opcua"
service_name  = "tedge-dot-opcua"
poll_interval = "2s"
log_level     = "info"

# Heartbeat (reporting policy, see doc/reducing-data-volume.md): publish every point at least
# this often, even when its value has not changed, because Cumulocity marks a device unavailable
# when it sends nothing within its required interval; 30m stays inside the usual 60m. A
# heartbeat is always a fresh reading, never a replayed value. A subscribed node is read on
# demand for it, which also proves the server is alive; a failed read publishes bad quality. A
# polled node publishes its next poll. A polled point without a change filter already publishes
# every reading, so this matters for points you give `on_change`, `deadband`, `min_interval` or
# `debounce` and for subscribed nodes whose value never changes. Those keys can be set here, on
# a device or on a point; "0" switches an inherited setting off.
report = { max_interval = "30m" }

[mqtt]
host = "127.0.0.1"
port = 1883

[connection]
application_name  = "tedge-dot"
security_policy   = "None"
security_mode     = "none"
connect_timeout_s = 10

[[device]]
name             = "opc1"
protocol_address = { endpoint = "opc.tcp://127.0.0.1:4840/", security_policy = "None", security_mode = "none" }
default_mode     = "typed"
points_from      = ["demo-sim"]

  # The points come from the packaged point library
  # points.d/opcua/demo-sim.toml (contract §3.4): the simulator's data point
  # list lives there, so this file holds only what is per-instance. An
  # installed package finds it automatically; from a source checkout point the
  # search path at the copy in this repo:
  #
  #   export TEDGE_DOT_POINT_LIBRARY_PATH=demo/points.d
  #
  # A device may still add points of its own, or adjust an inherited one by
  # naming its id and only the fields to change, e.g.:
  #
  #   [[device.point]]
  #   id   = "temperature"
  #   name = "A label of my own"

# The secured simulator (see the header). The connector generates its own certificate in
# /var/lib/tedge-dot/opcua/pki on first start.
#
# [[device]]
# name             = "opc-secure"
# protocol_address = { endpoint = "opc.tcp://127.0.0.1:4841/", security_policy = "Basic256Sha256", security_mode = "sign_and_encrypt", user = "operator", password = "demo-password" }
# default_mode     = "typed"
# points_from      = ["demo-sim"]
