name: Release

# One release, both implementations.
#
# tedge-dot ships as two interchangeable packages, each containing /usr/bin/tedge-dot:
#
#   * tedge-dot-rs -- the Rust implementation (impl/rust/), cross-compiled and packaged by
#     goreleaser with cargo-zigbuild;
#   * tedge-dot-c  -- the C implementation (impl/c/), cross-compiled in the zig + Debian
#     multiarch image in impl/c/cross/ and packaged with nfpm.
#
# They declare each other as conflicting and both Provide the `tedge-dot` virtual package, so
# a host installs one or the other. Building them needs completely different toolchains, hence
# the two build jobs; `publish` then assembles a single GitHub release (and a single Cloudsmith
# push) from both sets of assets, with one SHA256SUMS covering everything.
#
#   * called by release-please.yaml with the tag it just created
#                         -> deb/rpm/apk + tarballs for both packages attached to the GitHub
#                            release release-please made, plus the Cloudsmith push
#   * run manually        -> builds both and uploads them to the run; optionally refreshes the
#                            rolling `snapshot` pre-release so the latest build is one download
#                            away. Given an existing `tag`, it (re)builds and publishes that
#                            release instead -- the way to retry a failed release.
#
# There is deliberately no tag-push trigger: release-please creates the tags, and a tag made
# with a personal token would then release twice (the push and the call).

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and publish"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and publish; empty for a snapshot build"
        type: string
        default: ""
      publish_snapshot:
        description: "Refresh the rolling `snapshot` pre-release (ignored when a tag is given)"
        type: boolean
        default: false

permissions:
  contents: write

# Two tags pushed close together would otherwise race over the rolling `snapshot` release and
# over ci/publish.sh. Releases are cheap to redo and expensive to corrupt, so queue them.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Debian architectures the C build targets, and the oldest glibc its binaries must run on.
  # zig lets us pin the floor at 2.17 (Debian 8 / RHEL 7 era), which a native build cannot:
  # an ubuntu-24.04 build hard-requires glibc 2.39 on the target, ruling out most OT gateways.
  C_ARCHS: "amd64 arm64 armhf"
  GLIBC_MIN: "2.17"

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    # Every later job keys off these outputs, never off github.event_name/ref: in a called
    # workflow those describe the CALLER's event (a push to main), not the release.
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
      tag: ${{ steps.ver.outputs.tag }}
      ref: ${{ steps.ver.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - id: ver
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if [ -n "$TAG" ]; then
            # Fail here, not 30 minutes later in goreleaser, on a tag that does not exist.
            git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null \
              || { echo "::error::tag $TAG not found"; exit 1; }
            v="${TAG#v}"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            # Must match .goreleaser.yaml's `snapshot.version_template`, or one `snapshot`
            # pre-release carries the two packages at what look like different versions.
            v="0.0.0-pre.$(git rev-parse --short HEAD)"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Releasing version $v"

  rust:
    name: Build tedge-dot-rs (Rust)
    needs: version
    # macOS, not ubuntu: the darwin targets link Apple frameworks (IOKit, Security,
    # CoreFoundation) that zig cannot find without the macOS SDK, which failed the 0.0.1 tag
    # run on ubuntu. zig cross-compiles the Linux and Windows targets from here just the same.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
          # goreleaser derives the changelog from the full tag history
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            x86_64-unknown-linux-gnu,
            aarch64-unknown-linux-gnu,
            x86_64-apple-darwin,
            aarch64-apple-darwin,
            x86_64-pc-windows-gnu

      # cargo-zigbuild (used by the goreleaser Rust builder) links every
      # target with zig, so no per-target C toolchains are needed.
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl/rust

      # Always --skip=publish: the GitHub release is created once, by the `publish` job below,
      # so that it carries the C assets too.
      - name: Build packages
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: >-
            release --clean --skip=publish,announce
            ${{ needs.version.outputs.release != 'true' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the tag rather than let goreleaser pick one of several pointing at HEAD.
          GORELEASER_CURRENT_TAG: ${{ needs.version.outputs.tag }}

      # The connector is a dumb driver: without the flows nothing it publishes
      # reaches the thin-edge data model, so the package must deploy the core
      # pipeline active and ship the opt-in flows for the admin to enable.
      - name: Package smoke (flows are shipped)
        run: |
          set -eux
          # The macOS runner has no dpkg-deb.
          brew install dpkg
          deb=$(ls dist/tedge-dot-rs_*_linux_amd64.deb)
          dpkg-deb -I "$deb" | grep -E 'Package:|Depends:|Provides:|Conflicts:|Replaces:'
          # The package renaming is load-bearing: tedge-dot-rs and tedge-dot-c must stay
          # mutually exclusive, which is what Provides/Conflicts on the virtual package buys.
          dpkg-deb -f "$deb" Package | grep -qx 'tedge-dot-rs'
          dpkg-deb -f "$deb" Provides | grep -q 'tedge-dot'
          dpkg-deb -f "$deb" Conflicts | grep -q 'tedge-dot-c'
          # Cloud parameter writes need the c8y_ParameterUpdate template the plugin owns.
          dpkg-deb -f "$deb" Depends | grep -q 'tedge-parameter-plugin'
          contents=$(dpkg-deb -c "$deb")
          echo "$contents" | grep -q '/usr/bin/tedge-dot$'
          for flow in ot-measurement ot-registration ot-command-forward \
                      ot-command-result ot-parameter-state ot-alarm ot-event; do
            echo "$contents" | grep -q "/etc/tedge/mappers/c8y/flows/$flow/flow.toml"
            echo "$contents" | grep -q "/etc/tedge/mappers/c8y/flows/$flow/main.js"
          done
          # ot-alarm's companion flow: without it a restart raises standing alarms again.
          echo "$contents" | grep -q "/etc/tedge/mappers/c8y/flows/ot-alarm/alarm-state.toml"
          echo "$contents" | grep -q "/etc/tedge/mappers/c8y/flows/ot-alarm/alarm-state.js"
          tar -tzf dist/tedge-dot-rs_Linux_x86_64.tar.gz | grep -q "flows/ot-measurement/main.js"

      - uses: actions/upload-artifact@v4
        with:
          name: packages-rust
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  c:
    name: Build tedge-dot-c (C)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
          fetch-depth: 0

      # Needed to *run* the arm64/armhf binaries in the verify step below.
      - uses: docker/setup-qemu-action@v3

      - name: Build the cross-compilation image
        run: docker build -t tedge-dot-cross impl/c/cross

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' \
            | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Cross-build every architecture
        env:
          # Stamped into the binary so `tedge-dot --version` matches the package version.
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eux
          for arch in $C_ARCHS; do
            mkdir -p "impl/c/dist/$arch"
            docker run --rm \
              -v "$PWD:/src:ro" -v "$PWD/impl/c/dist/$arch:/out" \
              -e ARCH="$arch" -e GLIBC_MIN="$GLIBC_MIN" -e VERSION="$VERSION" \
              tedge-dot-cross
          done

      - name: Verify on an old distro (golden vectors, glibc floor)
        run: |
          set -eux
          for arch in $C_ARCHS; do
            case "$arch" in
              armhf) platform=linux/arm/v7 ;;
              *)     platform="linux/$arch" ;;
            esac
            docker run --rm --platform "$platform" \
              -v "$PWD/impl/c/dist/$arch:/out" \
              -v "$PWD:/src:ro" \
              -v "$PWD/impl/c/cross/verify.sh:/verify.sh:ro" \
              debian:bullseye-slim /verify.sh
          done

      - name: Package (deb / rpm / apk + tarball)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eux
          mkdir -p dist impl/c/dist/staged
          for arch in $C_ARCHS; do
            # nfpm expands env vars in scalar fields but not in contents[].src,
            # so stage this architecture's binary where nfpm.yaml points.
            cp "impl/c/dist/$arch/tedge-dot" impl/c/dist/staged/tedge-dot
            case "$arch" in
              armhf) export ARCH=arm7 ;;
              *)     export ARCH="$arch" ;;
            esac
            for format in deb rpm apk; do
              nfpm pkg -f impl/c/packaging/nfpm.yaml -p "$format" -t dist/
            done

            staging="tedge-dot-c_${VERSION}_linux_${arch}"
            mkdir -p "pkgroot/$staging"
            cp "impl/c/dist/$arch/tedge-dot" "pkgroot/$staging/"
            cp impl/c/README.md "pkgroot/$staging/"
            # Both halves of the default config set, as the .deb installs them: the shared
            # ones and the C-only profibus. Copying impl/c/packaging/config alone would ship a
            # config-defaults/ containing nothing but profibus.toml.
            mkdir -p "pkgroot/$staging/config-defaults"
            cp packaging/config/*.toml impl/c/packaging/config/*.toml \
               "pkgroot/$staging/config-defaults/"
            # The device-side flows, as the packages ship them (see flows/README.md):
            # a tarball install is manual, so the whole set travels with the binary.
            mkdir -p "pkgroot/$staging/flows"
            cp -r flows/ot-* flows/README.md "pkgroot/$staging/flows/"
            tar -czf "dist/${staging}.tar.gz" -C pkgroot "$staging"
          done
          ls -l dist

      - name: Package smoke (inspect, install, run)
        run: |
          set -eux
          deb=$(ls dist/tedge-dot-c_*_amd64.deb)
          echo "== control metadata =="
          dpkg-deb -I "$deb" | grep -E 'Package:|Version:|Architecture:|Depends:|Conflicts:|Provides:'
          # The package renaming is load-bearing: tedge-dot-c and tedge-dot-rs must stay
          # mutually exclusive, which is what Provides/Conflicts on the virtual package buys.
          dpkg-deb -f "$deb" Package | grep -qx 'tedge-dot-c'
          dpkg-deb -f "$deb" Provides | grep -q 'tedge-dot'
          dpkg-deb -f "$deb" Conflicts | grep -q 'tedge-dot-rs'
          # Cloud parameter writes need the c8y_ParameterUpdate template the plugin owns.
          dpkg-deb -f "$deb" Depends | grep -q 'tedge-parameter-plugin'
          # A real thin-edge host already has the tedge user; create it so the
          # package's tedge-owned config files and service user resolve cleanly.
          sudo groupadd --system tedge 2>/dev/null || true
          sudo useradd --system --gid tedge --no-create-home --shell /usr/sbin/nologin tedge 2>/dev/null || true
          # tedge-parameter-plugin (and its tedge-inventory chain) comes from the thin-edge
          # community repository, as on a real device. --no-install-recommends keeps the
          # inventory's Recommends on the full tedge stack off the runner.
          curl -1sLf 'https://dl.cloudsmith.io/public/thinedge/community/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y --no-install-recommends "./$deb"
          echo "== dependency installed =="
          dpkg -s tedge-parameter-plugin | grep -q '^Status: install ok installed'
          test -f /etc/tedge/operations/c8y/c8y_ParameterUpdate.template
          echo "== packaged binary runs =="
          command -v tedge-dot
          tedge-dot run /nonexistent 2>&1 | head -1 || true
          # The connector is a dumb driver: without the flows nothing it publishes
          # reaches the cloud, so the package must deploy the core pipeline active.
          echo "== flows deployed =="
          for flow in ot-measurement ot-registration ot-command-forward \
                      ot-command-result ot-parameter-state ot-alarm ot-event; do
            test -f "/etc/tedge/mappers/c8y/flows/$flow/flow.toml"
            test -f "/etc/tedge/mappers/c8y/flows/$flow/main.js"
          done
          # ot-alarm's companion flow: without it a restart raises standing alarms again.
          test -f /etc/tedge/mappers/c8y/flows/ot-alarm/alarm-state.toml
          test -f /etc/tedge/mappers/c8y/flows/ot-alarm/alarm-state.js

      - uses: actions/upload-artifact@v4
        with:
          name: packages-c
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, rust, c]
    # A production release + Cloudsmith push needs an explicit tag (release-please's, or one
    # typed into "Run workflow"); a manual run merely started FROM a tag stays a snapshot.
    if: needs.version.outputs.release == 'true' || inputs.publish_snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      # Both implementations' assets land in the same directory, so the release and the
      # Cloudsmith push each happen once and carry everything.
      - uses: actions/download-artifact@v4
        with:
          name: packages-rust
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: packages-c
          path: dist

      - name: One checksum file over every asset
        run: |
          set -eux
          ( cd dist && sha256sum ./* > ../SHA256SUMS.tmp && mv ../SHA256SUMS.tmp SHA256SUMS )
          ls -l dist
          # Both packages must be in the release; a silently missing build job would
          # otherwise ship a half release.
          ls dist/tedge-dot-rs_*.deb >/dev/null
          ls dist/tedge-dot-c_*.deb >/dev/null

      - name: Resolve release tag
        id: rel
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [ "${{ needs.version.outputs.release }}" = "true" ]; then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "title=tedge-dot $TAG" >> "$GITHUB_OUTPUT"
            echo "prerelease=" >> "$GITHUB_OUTPUT"
          else
            echo "tag=snapshot" >> "$GITHUB_OUTPUT"
            echo "title=tedge-dot (rolling snapshot)" >> "$GITHUB_OUTPUT"
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          fi

      # The handwritten preamble (which package do I want, how do I install it) followed by
      # the changelog: release-please's CHANGELOG.md section when it already created the
      # release, GitHub's generated notes otherwise (a snapshot). A re-run must not stack a
      # second preamble on top of the first, so an existing body is cut at the marker.
      - name: Assemble release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -eu
          marker='<!-- changelog -->'
          cp packaging/release-notes.md notes.md
          printf '\n---\n\n%s\n\n' "$marker" >> notes.md
          if [ "$TAG" != "snapshot" ] \
             && body=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq .body 2>/dev/null) \
             && [ -n "$body" ]; then
            printf '%s\n' "$body" | awk -v m="$marker" 'found {print} $0 == m {found=1}' > changelog.md
            # No marker: the body is release-please's changelog section as created.
            [ -s changelog.md ] || printf '%s\n' "$body" > changelog.md
            cat changelog.md >> notes.md
          else
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="${{ needs.version.outputs.ref }}" \
              --jq .body >> notes.md || echo "_No changelog available._" >> notes.md
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
          TITLE: ${{ steps.rel.outputs.title }}
          PRERELEASE: ${{ steps.rel.outputs.prerelease }}
        run: |
          set -eux
          # The snapshot tag is rolling: replace the previous release and tag.
          if [ "$TAG" = "snapshot" ]; then
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi
          # release-please has normally created the release already; a re-run (a flaky asset
          # upload, the Cloudsmith step below) finds it too. Either way, fill in the existing
          # release rather than dying with "already exists".
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "${{ github.repository }}" \
              --title "$TITLE" --notes-file notes.md
            gh release upload "$TAG" dist/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "${{ github.repository }}" \
              --target "${{ needs.version.outputs.ref }}" \
              --title "$TITLE" \
              --notes-file notes.md \
              $PRERELEASE
          fi

      - name: Publish packages to Cloudsmith
        if: needs.version.outputs.release == 'true'
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PUBLISH_OWNER: thinedge
          PUBLISH_REPO: community
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "PUBLISH_TOKEN secret not set; skipping Cloudsmith publish"
            exit 0
          fi
          ./ci/publish.sh --path ./dist
