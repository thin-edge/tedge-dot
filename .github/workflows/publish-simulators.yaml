# Build and publish the OT protocol simulator containers used by
# demo/docker-compose.yaml to GitHub Container Registry, so users can pull
# prebuilt images instead of building them from the repository.
#
# Images are published as:
#   ghcr.io/<owner>/<repo>/<proto>-sim:latest      (default branch)
#   ghcr.io/<owner>/<repo>/<proto>-sim:<version>   (git tags)
#
# Pull requests that touch a simulator build the image (both platforms) but
# do not push, so breakage is caught before merge.
name: Publish simulators

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    paths:
      - "connectors/*/sim/**"
      - "connectors/snmp/agent/**"
      - ".github/workflows/publish-simulators.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sim: [modbus, opcua, canbus, canopen, profibus, snmp]
        # A simulator whose image is not connectors/<sim>/sim/Dockerfile names its own file:
        # the SNMP agent the connector polls (the `snmp` image is the notification sender).
        include:
          - sim: snmp-agent
            file: connectors/snmp/agent/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # The simulators run on real Linux devices (often ARM), so publish
      # multi-arch images. They are thin Python images, so emulated arm64
      # builds are cheap.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.sim }}-sim
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file || format('connectors/{0}/sim/Dockerfile', matrix.sim) }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.sim }}-sim
          cache-to: type=gha,mode=max,scope=${{ matrix.sim }}-sim

  # The OPC UA interop suite's servers: the OPC Foundation UA-.NETStandard reference stack,
  # packaged by php-opcua/uanetstandard-test-suite (MIT, over OPC Foundation MIT 1.00).
  #
  # We build it ourselves rather than use their published image because that one is amd64-only
  # and aborts under qemu with a .NET AccessViolationException, which would make the interop
  # suite unrunnable on an arm64 developer machine. Their Dockerfile is used unmodified and the
  # build context is a pinned upstream tag, so none of their source is vendored here and we
  # carry no patches. Bumping REFSERVER_REF is a reviewed commit.
  # Bumping REFSERVER_REF means bumping the image tag and build context in
  # connectors/opcua/interop/docker-compose.yaml to match.
  publish-refserver:
    runs-on: ubuntu-latest
    env:
      REFSERVER_REF: v1.5.5
    steps:
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          # A git context: nothing of this repository is sent, and nothing of theirs is stored
          # here. Their Dockerfile builds .NET for both architectures from multi-arch bases.
          context: "https://github.com/php-opcua/uanetstandard-test-suite.git#${{ env.REFSERVER_REF }}"
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}/uanetstandard-refserver:${{ env.REFSERVER_REF }}
          cache-from: type=gha,scope=uanetstandard-refserver
          cache-to: type=gha,mode=max,scope=uanetstandard-refserver
