# Default PROFIBUS-DP connector configuration installed by the tedge-dot-c
# package. (The C build includes PROFIBUS; the Rust package does not, because
# its serial dependency does not cross-compile.)
#
# No devices are configured out of the box, so the service starts and stays
# active on a fresh install. Add `[[device]]` sections and reload the service:
#
#   sudo systemctl reload tedge-dot

[connector]
protocol      = "profibus"
service_name  = "tedge-dot-profibus"
poll_interval = "500ms"
log_level     = "info"

# Heartbeat (reporting policy, see doc/reducing-data-volume.md): publish every point at least
# this often, even when its value has not changed, because Cumulocity marks a device unavailable
# when it sends nothing within its required interval; 30m stays inside the usual 60m. A
# heartbeat is always a fresh reading, never a replayed value. It is the point's next poll. A
# polled point without a change filter already publishes every reading, so this matters for
# points you give `on_change`, `deadband`, `min_interval` or `debounce`. Those keys can be set
# here, on a device or on a point; "0" switches an inherited setting off.
report = { max_interval = "30m" }

[mqtt]
host = "127.0.0.1"
port = 1883

# Shared bus parameters. The C connector speaks serial-over-TCP only
# (port = "tcp://host:port"); point it at a serial-to-TCP device server or the
# demo simulator.
[connection]
port           = "tcp://127.0.0.1:9200"
baudrate       = 19200
master_address = 2
slot_bits      = 300

# Add peripherals below, for example:
#
# [[device]]
# name             = "remote_io"
# type             = "acme-io-v1"    # the device TYPE: names its parameter sets (§5.2)
# protocol_address = { station_address = 7, ident_number = 0, input_bytes = 8, output_bytes = 4 }
#
#   [[device.point]]
#   id       = "di_byte0"
#   datatype = "uint8"
#   access   = "read"
#   address  = { direction = "input", byte_offset = 0 }
