schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  tasks:
    - For a user-visible change, include a task to add a release highlight in
      changes/<change-name>.md (see changes/README.md); never edit packaging/release-notes.md
      for a feature, it is the fixed header of every release.
    - For a user-visible change, include a task to update the documentation site in the same
      change (site/, see openspec/changes/docs-site/specs/docs-site/spec.md "The site keeps up
      with the product"): place any new doc/ file in site/docs-map.yaml (pages or github_only),
      update the guides and overview that cover the area, and extend the tools (config builder,
      playgrounds) when their subject changed.
