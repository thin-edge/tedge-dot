# The page map: every repository file that appears on the documentation site.
#
# scripts/sync-docs.mjs turns each entry into a generated page at src/content/docs/<slug>.md
# (git-ignored), and astro.config.mjs builds the Reference sidebar from `section`. A file that
# is not listed here stays GitHub-only: a link to it from a published page goes to GitHub.
#
#   source:  path from the repository root
#   slug:    the page's path on the site (lowercase, no extension)
#   section: the Reference sidebar group (one of `sections`), or omitted for a page that an
#            authored sidebar entry places elsewhere (the install guide under Get started)
#   label:   the sidebar label, when the page title is too long for it (optional)

repository: thin-edge/tedge-dot
branch: main

# Reference sidebar groups, in order.
sections:
  - Contract
  - Configuration
  - Connectors
  - Flows
  - SDK and implementations
  - Design and RFCs
  - Migration
  - Project

