# End-to-end harness for the Modbus connector.
#
# The stack is started by the Robot suite itself (DeviceLibrary, see
# connectors/_shared/stack.resource): every setup creates its own compose project with a
# random name, so suites are isolated and nothing has to be started beforehand.
#
# Ports are therefore published WITHOUT a fixed host port (parallel-safe); the suite resolves
# the broker's ephemeral port with `Get Service Port`. For manual work the host ports can be
# pinned via the env vars below (`just sim modbus` / `just e2e-up modbus` do this):
#   BROKER_PORT
#   MODBUS_SIM_PORT
services:
  broker:
    image: ${BASE_REGISTRY:-public.ecr.aws/docker/library}/eclipse-mosquitto:2
    volumes:
      - ../_shared/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - target: 1883
        published: "${BROKER_PORT:-}"

  simulator:
    build:
      context: ../..
      dockerfile: connectors/modbus/sim/Dockerfile
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-public.ecr.aws/docker/library}
    ports:
      - target: 502
        published: "${MODBUS_SIM_PORT:-}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  connector:
    # Stable image name so every (randomly named) project reuses the built image instead of
    # rebuilding it. IMPL/CONNECTOR_DOCKERFILE select the implementation under test:
    # the Rust build by default, the C build (impl/c/) via `just test-e2e-c modbus`.
    image: tedge-dot-${IMPL:-rust}-modbus-connector
    build:
      context: ../..
      dockerfile: ${CONNECTOR_DOCKERFILE:-connectors/modbus/Dockerfile.connector}
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-public.ecr.aws/docker/library}
        PROTOCOL: modbus
    labels:
      # Marks the service DeviceLibrary treats as the device under test, so `Execute Command`
      # runs inside the connector container ("${SERIAL}:broker" etc. address the others).
      device-test-core.role: main
    depends_on:
      broker:
        condition: service_started
      simulator:
        condition: service_healthy

  # thin-edge flows engine (user-defined mapper, no cloud) running this repo's flows against
  # the same broker, so the suite can drive the device-side command/parameter bridge end to end.
  flows:
    build:
      context: ../..
      dockerfile: connectors/_shared/Dockerfile.flows
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-public.ecr.aws/docker/library}
        PROTOCOL: modbus
    depends_on:
      broker:
        condition: service_started
