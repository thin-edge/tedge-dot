# End-to-end harness for the PROFIBUS-DP connector.
#
# The stack is started by the Robot suite itself (DeviceLibrary, see
# connectors/_shared/stack.resource): every setup creates its own compose project with a
# random name, so suites are isolated and nothing has to be started beforehand.
#
# Ports are therefore published WITHOUT a fixed host port (parallel-safe); the suite resolves
# the broker's ephemeral port with `Get Service Port`. For manual work the host ports can be
# pinned via the env vars below (`just sim profibus` / `just e2e-up profibus` do this):
#   BROKER_PORT
#   PROFIBUS_SIM_PORT
services:
  broker:
    image: ${BASE_REGISTRY:-public.ecr.aws/docker/library}/eclipse-mosquitto:2
    volumes:
      - ../_shared/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - target: 1883
        published: "${BROKER_PORT:-}"

  simulator:
    build:
      context: ../..
      dockerfile: connectors/profibus/sim/Dockerfile
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-public.ecr.aws/docker/library}
    ports:
      - target: 9200
        published: "${PROFIBUS_SIM_PORT:-}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "grep", "-q", ":23F0", "/proc/net/tcp"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 3s

  # A second simulator for the measurement-output instance (connector-measure.toml): a
  # simulator takes one master connection, and the main instance holds `simulator`'s.
  measure-simulator:
    build:
      context: ../..
      dockerfile: connectors/profibus/sim/Dockerfile
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-public.ecr.aws/docker/library}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "grep", "-q", ":23F0", "/proc/net/tcp"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 3s

  connector:
    # Stable image name so every (randomly named) project reuses the built image instead of
    # rebuilding it. IMPL/CONNECTOR_DOCKERFILE select the implementation under test:
    # the Rust build by default, the C build (impl/c/) via `just test-e2e-c profibus`.
    image: tedge-dot-${IMPL:-rust}-profibus-connector
    build:
      context: ../..
      dockerfile: ${CONNECTOR_DOCKERFILE:-connectors/profibus/Dockerfile.connector}
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-public.ecr.aws/docker/library}
        PROTOCOL: profibus
    labels:
      # Marks the service DeviceLibrary treats as the device under test, so `Execute Command`
      # runs inside the connector container ("${SERIAL}:broker" etc. address the others).
      device-test-core.role: main
    depends_on:
      broker:
        condition: service_started
      simulator:
        condition: service_healthy
      measure-simulator:
        condition: service_healthy
