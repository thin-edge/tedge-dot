# Generated by connectors/aveva-pi/tools/plugin-to-tedge-dot.py from
# pi_config.json and datapoints.json.
[connector]
protocol      = "aveva-pi"
service_name  = "tedge-dot-aveva-pi"
poll_interval = "30s"
output        = "measurements"

[connection]
auth = { method = "basic", username = "CORP\\pi-reader", password_file = "/etc/tedge/plugins/ot/secrets/aveva-pi.password" }
tls  = { ca_file = "/etc/tedge/plugins/ot/certs/pi-ca.pem" }

[[device]]
name             = "pi-plant1"
protocol_address = { base_url = "https://pi.example.com/piwebapi", data_server = "PISRV01" }

  [[device.point]]
  id       = "SINUSOID"
  datatype = "float64"
  address  = { tag = "SINUSOID" }

  [[device.point]]
  id       = "REACTOR01_TEMP"
  datatype = "float32"
  address  = { tag = "REACTOR01.TEMP" }

  [[device.point]]
  id       = "TICKS"
  datatype = "int32"
  address  = { tag = "TICKS" }

  [[device.point]]
  id       = "COUNT16"
  datatype = "int16"
  address  = { tag = "COUNT16" }

  [[device.point]]
  id       = "PUMP01_STATE"
  datatype = "int32"
  address  = { tag = "PUMP01.STATE" }

  [[device.point]]
  id       = "BATCH_ID"
  datatype = "string"
  address  = { tag = "BATCH.ID" }

  [[device.point]]
  id       = "LAST_CHANGE"
  datatype = "string"
  address  = { tag = "LAST.CHANGE" }

  [[device.point]]
  id       = "NOPE"
  datatype = "float64"
  address  = { tag = "NOPE" }
