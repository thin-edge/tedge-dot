# The `opcm` device of the OPC UA e2e harness, in grouped output (contract §5.5, openspec change
# native-batched-output): the connector publishes the thin-edge measurements itself, several
# series per message, and samples only for the points a flow reads. `output` is a connector
# setting, so the device is its own connector instance (entrypoint.sh runs every
# connector-*.toml).
#
#   temperature  polled, with a unit           -> a series of m/opcua, and the units metadata
#   hot          polled, declares an alarm     -> a series, and a sample marked "measured" that
#                                                 ot-alarm raises the alarm from
#   count        polled, named by its meta     -> the series Plant.Count on m/Plant
#   stamped      pushed, sample = true         -> keeps the server's source time (§5.4)
#
# The `opcf` device frames the load-simulator's Burst node (written five times in a row every
# second) in 500 ms windows, read twice as `burst` and `burst2` (openspec change frame-layers):
# each value of a window goes into its own layer, holding both points, and layer times strictly
# increase even when the writes share a millisecond.
#
# The `opca` device polls Ticks (incremented every second) every 200 ms and publishes its
# time-weighted mean and its maximum every 2 s (openspec change sample-aggregate).

[connector]
protocol      = "opcua"
service_name  = "tedge-dot-measure"
poll_interval = "1s"
log_level     = "info"
operation_timeout = "5s"
output        = "group"

[mqtt]
host = "broker"
port = 1883

[connection]
application_name = "tedge-dot-measure"
security_policy  = "None"
security_mode    = "none"

[[device]]
name             = "opcm"
protocol_address = { endpoint = "opc.tcp://simulator:4840/", security_policy = "None", security_mode = "none" }
default_mode     = "typed"

  [[device.point]]
  id        = "temperature"
  subscribe = false
  datatype  = "float64"
  unit      = "°C"
  address   = { node_id = "ns=2;s=Temperature" }

  [[device.point]]
  id        = "hot"
  subscribe = false
  datatype  = "float64"
  address   = { node_id = "ns=2;s=Temperature" }
  meta      = { alarm = { type = "opcm_hot", when = { above = 20 } } }

  [[device.point]]
  id        = "count"
  subscribe = false
  datatype  = "uint32"
  address   = { node_id = "ns=2;s=Count" }
  meta      = { measurement = { type = "Plant", series = "Count" } }

  [[device.point]]
  id        = "stamped"
  datatype  = "float64"
  sample    = true
  address   = { node_id = "ns=2;s=Stamped" }

[[device]]
name              = "opcf"
protocol_address  = { endpoint = "opc.tcp://load-simulator:4840/" }
default_mode      = "typed"
sampling_interval = "1s"
grouping          = { by = "frame", window = "500ms" }

  [[device.point]]
  id       = "burst"
  datatype = "uint32"
  address  = { node_id = "ns=2;s=Burst" }

  [[device.point]]
  id       = "burst2"
  datatype = "uint32"
  address  = { node_id = "ns=2;s=Burst" }

[[device]]
name             = "opca"
protocol_address = { endpoint = "opc.tcp://simulator:4840/", security_policy = "None", security_mode = "none" }
default_mode     = "typed"
poll_interval    = "200ms"
grouping         = { aggregate = ["mean", "max"], every = "2s" }

  [[device.point]]
  id        = "ticks"
  subscribe = false
  datatype  = "uint32"
  unit      = "s"
  address   = { node_id = "ns=2;s=Ticks" }
