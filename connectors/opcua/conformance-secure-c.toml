# Secured-channel conformance manifest for the C build of the OPC UA connector (impl/c/).
#
# The claims are now IDENTICAL to conformance.toml -- both implementations support
# monitored-item push delivery. Keep them that way: a difference here is a parity gap, and
# belongs in the table in impl/c/README.md and in the justfile's C_MISSING_CAPABILITIES.
#
# Run the full suite (layers 1-3, no external server or broker):
#
#   cargo run --manifest-path impl/rust/Cargo.toml -p ot-conformance -- check --spec connectors/opcua/conformance-secure-c.toml
#
# The behavioural layer runs against the harness's embedded async-opcua server with SECURED
# endpoints (a generated certificate, username and X.509 users; seed-secure.json), fronted
# by a transport proxy for the link-drop checks. The behavioural checks drive the polling
# path; push delivery (subscribe) is covered by the connector's own integration tests.

[connector]
protocol    = "opcua"
modes       = ["raw", "typed"]
datatypes   = ["bool", "int8", "uint8", "int16", "uint16", "int32", "uint32", "int64", "uint64", "float32", "float64", "string"]
point_kinds = ["variable"]
verbs       = ["write"]
features    = ["polling", "subscribe"]
subscribe   = true

[simulator]
kind = "opcua"
seed = "conformance/seed-secure.json"

[harness]
config = "conformance/connector-secure.toml"

# Exercise the C build (impl/c/) instead of the in-process module.
command = ["impl/c/build/tedge-dot", "run"]
