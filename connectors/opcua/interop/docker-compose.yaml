# INTEROP stack for the OPC UA connector (tests/opcua_interop.robot starts it with
# `Setup OT Stack opcua compose_file=...`).
#
# The servers are the OPC Foundation UA-.NETStandard reference stack, packaged by
# php-opcua/uanetstandard-test-suite (MIT, over OPC Foundation MIT 1.00). Upstream publishes
# an amd64-only image that aborts under qemu, so we build their unmodified Dockerfile from a
# pinned tag for both architectures and publish it ourselves; see
# openspec/changes/opcua-reference-server-interop/design.md.
#
# One image, five profiles -- everything is env-driven, so a profile is just a set of
# variables. `ref-all` alone serves 11 endpoints (every policy x mode).
#
# Note: the reference server advertises `opc.tcp://0.0.0.0:<port><path>` as its endpoint URL
# (BuildBaseAddresses hardcodes it and ignores OPCUA_HOSTNAME). A client that dials what the
# server advertises cannot connect at all -- which is exactly what the connector's "keep the
# configured address" rule exists for, and what `Server Advertising 0.0.0.0 Is Reachable`
# pins.
#
# Ports are published without a fixed host port (parallel-safe); BROKER_PORT pins the broker's
# by hand. The servers need no host port: only the connector talks to them.

# The tag is written out rather than interpolated: `just _pull-stack-images` greps `image:`
# lines and hands them to `docker pull` verbatim, so a `${VAR}` here reaches docker as those
# literal characters and is rejected as an invalid reference. Bumping it means editing this
# line and REFSERVER_REF in .github/workflows/publish-simulators.yaml together.
x-refserver: &refserver
  image: ghcr.io/thin-edge/tedge-dot/uanetstandard-refserver:v1.5.5
  restart: unless-stopped

services:
  # Gives the servers that need one an RSA-2048 certificate; see gen-server-certs.sh for why
  # the auto-generated 1024-bit one makes every modern policy untestable.
  refserver-certs:
    image: public.ecr.aws/docker/library/alpine:3
    entrypoint: ["/bin/sh", "-c"]
    command:
      - apk add --no-cache openssl >/dev/null && exec /opt/interop/gen-server-certs.sh ref-all ref-token ref-strict
    volumes:
      - ./:/opt/interop:ro
      - certs-ref-all:/out/ref-all
      - certs-ref-token:/out/ref-token
      - refserver-trust:/out/ref-strict

  broker:
    image: public.ecr.aws/docker/library/eclipse-mosquitto:2
    volumes:
      - ../../_shared/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - target: 1883
        published: "${BROKER_PORT:-}"

  # Every policy and mode, every identity type, auto-accepting our certificate: the target for
  # the matrix, identity and address-space tests. Only this service declares `build:`, so the
  # image is built once (just _prebuild-stack-images) and the others reuse it.
  ref-all:
    <<: *refserver
    build:
      # Builds the image when it has not been published yet (a pull request before the tag
      # exists on ghcr, or a fresh checkout); otherwise the pull above wins.
      context: "https://github.com/php-opcua/uanetstandard-test-suite.git#v1.5.5"
    environment:
      OPCUA_SERVER_NAME: ref-all
      OPCUA_PORT: "4840"
      OPCUA_RESOURCE_PATH: /UA/TestServer
      OPCUA_SECURITY_POLICIES: "None,Basic128Rsa15,Basic256,Basic256Sha256,Aes128_Sha256_RsaOaep,Aes256_Sha256_RsaPss"
      OPCUA_SECURITY_MODES: "None,Sign,SignAndEncrypt"
      OPCUA_ALLOW_ANONYMOUS: "true"
      OPCUA_AUTH_USERS: "true"
      OPCUA_AUTH_CERTIFICATE: "true"
      OPCUA_AUTO_ACCEPT_CERTS: "true"
      OPCUA_ENABLE_DYNAMIC: "true"
      # Installs the RSA-2048 certificate from /app/certs/https-server; without it the server
      # presents a 1024-bit key that no modern policy allows.
      OPCUA_ENABLE_HTTPS: "true"
      OPCUA_HTTPS_PORT: "4843"
    volumes:
      - certs-ref-all:/app/certs
    depends_on:
      refserver-certs:
        condition: service_completed_successfully
    healthcheck: &refserver-health
      # The runtime image is aspnet-alpine: its busybox `nc` has no `-z`, `dotnet` is not on
      # PATH, and the port speaks OPC UA binary rather than HTTP, so wget cannot probe it.
      # /proc/net/tcp needs no tooling at all: 12E8 is 4840, state 0A is LISTEN.
      test: ["CMD", "sh", "-c", "grep -q ':12E8 0[0-9A-F]*:0000 0A' /proc/net/tcp"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  # Does NOT auto-accept an unknown client certificate: the only way to exercise the server
  # refusing OUR application certificate. entrypoint.sh drops our certificate into the shared
  # `refserver-trust` volume, which the server copies into its trust list AT STARTUP -- so the
  # suite restarts this service to make the trust take effect.
  ref-strict:
    <<: *refserver
    environment:
      OPCUA_SERVER_NAME: ref-strict
      OPCUA_PORT: "4840"
      OPCUA_RESOURCE_PATH: /UA/TestServer
      # As for ref-token, `None` exists so ns-resolver can read the namespace array. It does
      # not soften what this server tests: the `strict` device asks for
      # Basic256Sha256/sign_and_encrypt, and OPCUA_AUTO_ACCEPT_CERTS stays false.
      OPCUA_SECURITY_POLICIES: "None,Basic256Sha256"
      OPCUA_SECURITY_MODES: "None,SignAndEncrypt"
      OPCUA_ALLOW_ANONYMOUS: "true"
      OPCUA_AUTO_ACCEPT_CERTS: "false"
      OPCUA_ENABLE_HTTPS: "true"
      OPCUA_HTTPS_PORT: "4843"
    volumes:
      - refserver-trust:/app/certs
    depends_on:
      refserver-certs:
        condition: service_completed_successfully
    healthcheck: *refserver-health

  # Elliptic-curve policies only. Neither connector implements them, so a device pointed here
  # must fail with a listed "no matching endpoint:" reason rather than crash or hang.
  ref-ecc:
    <<: *refserver
    environment:
      OPCUA_SERVER_NAME: ref-ecc
      OPCUA_PORT: "4840"
      OPCUA_RESOURCE_PATH: /UA/TestServer
      OPCUA_SECURITY_POLICIES: "ECC_nistP256,ECC_nistP384"
      OPCUA_SECURITY_MODES: "Sign,SignAndEncrypt"
      OPCUA_ALLOW_ANONYMOUS: "true"
      OPCUA_AUTO_ACCEPT_CERTS: "true"
    healthcheck: *refserver-health

  # A short secure-channel token, so a test run of a couple of minutes spans several renewals.
  ref-token:
    <<: *refserver
    environment:
      OPCUA_SERVER_NAME: ref-token
      OPCUA_PORT: "4840"
      OPCUA_RESOURCE_PATH: /UA/TestServer
      # `None` is here for ns-resolver, which reads the namespace array over an unsecured
      # session; without it the server answers BadSecurityPolicyRejected and nothing can be
      # resolved. The `token` device still asks for Basic256Sha256/sign_and_encrypt, so what
      # this server exists to exercise is unchanged.
      OPCUA_SECURITY_POLICIES: "None,Basic256Sha256"
      OPCUA_SECURITY_MODES: "None,SignAndEncrypt"
      OPCUA_ALLOW_ANONYMOUS: "true"
      OPCUA_AUTO_ACCEPT_CERTS: "true"
      OPCUA_SECURITY_TOKEN_LIFETIME: "30000"
      OPCUA_ENABLE_HTTPS: "true"
      OPCUA_HTTPS_PORT: "4843"
    volumes:
      - certs-ref-token:/app/certs
    depends_on:
      refserver-certs:
        condition: service_completed_successfully
    healthcheck: *refserver-health

  # An endpoint with no resource path at all (the discovery instance). It deliberately keeps
  # the weak 1024-bit certificate UA-.NETStandard generates for itself: that is what
  # `Weak Server Certificate Is Refused With Its Key Length` needs a server for.
  ref-discovery:
    <<: *refserver
    environment:
      OPCUA_SERVER_NAME: ref-discovery
      OPCUA_PORT: "4840"
      OPCUA_RESOURCE_PATH: ""
      OPCUA_IS_DISCOVERY: "true"
      OPCUA_SECURITY_POLICIES: "None,Basic256Sha256"
      OPCUA_SECURITY_MODES: "None,SignAndEncrypt"
      OPCUA_ALLOW_ANONYMOUS: "true"
      OPCUA_AUTO_ACCEPT_CERTS: "true"
    healthcheck: *refserver-health

  # Resolves each server's namespace index and renders connector.toml from its template. The
  # indices are documented as typical, not guaranteed, and the connector can only address a
  # node by index -- so they are looked up, never assumed, andeach server is asked for its own.
  # Runs to completion before the connector starts.
  ns-resolver:
    build:
      context: ../../..
      dockerfile: connectors/opcua/sim/Dockerfile
    entrypoint: ["python", "/opt/interop/resolve-ns.py"]
    command:
      - /opt/interop/connector.toml.in
      - /rendered/connector.toml
      - "@NS_REF_ALL@=opc.tcp://ref-all:4840/UA/TestServer"
      - "@NS_REF_DISCOVERY@=opc.tcp://ref-discovery:4840"
      - "@NS_REF_TOKEN@=opc.tcp://ref-token:4840/UA/TestServer"
      - "@NS_REF_STRICT@=opc.tcp://ref-strict:4840/UA/TestServer"
    volumes:
      - ./:/opt/interop:ro
      - rendered:/rendered
    depends_on:
      ref-all:
        condition: service_healthy
      ref-discovery:
        condition: service_healthy
      ref-token:
        condition: service_healthy
      ref-strict:
        condition: service_healthy

  connector:
    image: tedge-dot-${IMPL:-rust}-opcua-connector
    build:
      context: ../../..
      dockerfile: ${CONNECTOR_DOCKERFILE:-connectors/opcua/Dockerfile.connector}
      args:
        PROTOCOL: opcua
    entrypoint: ["/opt/interop/entrypoint.sh"]
    volumes:
      - ./:/opt/interop:ro
      - rendered:/rendered
      - refserver-trust:/refserver-trust
    labels:
      device-test-core.role: main
    depends_on:
      broker:
        condition: service_started
      ns-resolver:
        condition: service_completed_successfully
      ref-strict:
        condition: service_healthy
      ref-ecc:
        condition: service_healthy
      ref-token:
        condition: service_healthy
      ref-discovery:
        condition: service_healthy

volumes:
  rendered:
  refserver-trust:
  certs-ref-all:
  certs-ref-token:
