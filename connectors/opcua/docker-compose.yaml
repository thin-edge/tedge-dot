# End-to-end harness for the OPC UA connector.
#
# The stack is started by the Robot suite itself (DeviceLibrary, see
# connectors/_shared/stack.resource): every setup creates its own compose project with a
# random name, so suites are isolated and nothing has to be started beforehand.
#
# Ports are therefore published WITHOUT a fixed host port (parallel-safe); the suite resolves
# the broker's ephemeral port with `Get Service Port`. For manual work the host ports can be
# pinned via the env vars below (`just sim opcua` / `just e2e-up opcua` do this):
#   BROKER_PORT
#   OPCUA_SIM_PORT
services:
  broker:
    image: public.ecr.aws/docker/library/eclipse-mosquitto:2
    volumes:
      - ../_shared/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - target: 1883
        published: "${BROKER_PORT:-}"

  simulator:
    build:
      context: ../..
      dockerfile: connectors/opcua/sim/Dockerfile
    ports:
      - target: 4840
        published: "${OPCUA_SIM_PORT:-}"
    environment:
      # Advertise the docker service hostname so the client's endpoint matches.
      OPCUA_ENDPOINT_HOST: simulator

  # The same simulator again, for the sampling_interval device (opc3 in connector.toml) only.
  # It is kept apart so the outage tests, which stop or freeze `simulator`, leave opc3 alone:
  # with its 200 ms keep-alive window it would notice an outage first, and the C runtime's
  # blocking teardown and reconnects of it would delay how soon the other devices are noticed.
  sampling-simulator:
    build:
      context: ../..
      dockerfile: connectors/opcua/sim/Dockerfile
    environment:
      OPCUA_ENDPOINT_HOST: sampling-simulator

  connector:
    # Stable image name so every (randomly named) project reuses the built image instead of
    # rebuilding it. IMPL/CONNECTOR_DOCKERFILE select the implementation under test:
    # the Rust build by default, the C build (impl/c/) via `just test-e2e-c opcua`.
    image: tedge-dot-${IMPL:-rust}-opcua-connector
    build:
      context: ../..
      dockerfile: ${CONNECTOR_DOCKERFILE:-connectors/opcua/Dockerfile.connector}
      args:
        PROTOCOL: opcua
    labels:
      # Marks the service DeviceLibrary treats as the device under test, so `Execute Command`
      # runs inside the connector container ("${SERIAL}:broker" etc. address the others).
      device-test-core.role: main
    depends_on:
      - broker
      - simulator
      - sampling-simulator

  # thin-edge flows engine (user-defined mapper, no cloud) running this repo's flows against
  # the same broker, so the suite can drive the device-side command/parameter bridge end to end.
  flows:
    build:
      context: ../..
      dockerfile: connectors/_shared/Dockerfile.flows
      args:
        PROTOCOL: opcua
    depends_on:
      broker:
        condition: service_started
