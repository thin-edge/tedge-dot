# End-to-end harness for the CAN bus connector (SocketCAN).
#
# The stack is started by the Robot suite itself (DeviceLibrary, see
# connectors/_shared/stack.resource): every setup creates its own compose project with a
# random name, so nothing has to be started beforehand.
#
# Unlike the other protocols this stack is host-networked: the connector and the simulator need
# the host's network namespace to see the virtual CAN interface (vcan0). The broker therefore
# listens on the host loopback on port 13883 (no published container port), and the suite
# connects to localhost:13883. Consequence: only ONE canbus stack can run at a time on a host,
# since vcan0 is shared — the two CAN stacks use different ports so they can run together.
services:
  broker:
    # Host networking with a protocol-specific port: the SocketCAN connector and simulator need
    # the host's network namespace (vcan0), so they reach the broker over the host loopback.
    # No published port at all, which keeps the project parallel-safe.
    network_mode: host
    image: ${BASE_REGISTRY:-public.ecr.aws/docker/library}/eclipse-mosquitto:2
    volumes:
      - ../_shared/mosquitto-anon.conf:/mosquitto/config/mosquitto.conf:ro
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf", "-p", "13883"]

  simulator:
    build:
      context: ../..
      dockerfile: connectors/canbus/sim/Dockerfile
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-public.ecr.aws/docker/library}
    network_mode: host
    privileged: true
    depends_on:
      broker:
        condition: service_started
    healthcheck:
      test: ["CMD", "ip", "link", "show", "vcan0"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

  connector:
    # Stable image name so every (randomly named) project reuses the built image instead of
    # rebuilding it. IMPL/CONNECTOR_DOCKERFILE select the implementation under test:
    # the Rust build by default, the C build (impl/c/) via `just test-e2e-c canbus`.
    image: tedge-dot-${IMPL:-rust}-canbus-connector
    build:
      context: ../..
      dockerfile: ${CONNECTOR_DOCKERFILE:-connectors/canbus/Dockerfile.connector}
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-public.ecr.aws/docker/library}
        PROTOCOL: canbus
    labels:
      # Marks the service DeviceLibrary treats as the device under test, so `Execute Command`
      # runs inside the connector container ("${SERIAL}:broker" etc. address the others).
      device-test-core.role: main
    network_mode: host
    privileged: true
    depends_on:
      broker:
        condition: service_started
      simulator:
        condition: service_healthy
