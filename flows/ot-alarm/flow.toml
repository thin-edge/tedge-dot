# ot-alarm: OT signal -> thin-edge alarm (retained; raised and cleared)
#
# Per-signal alarms declared on a connector point's `meta.alarm`, evaluated on its samples for any
# value (number, boolean, string). Inert without a declaration, so the flow ships active. The
# measurement-series alarm (one series, a threshold) is the separate flow ot-alarm-series.
#
# The companion flow alarm-state.toml records which alarms are standing, so a restart does not
# raise a still-retained alarm again.
input.mqtt.topics = [
  "te/+/+/ot/+/sample/+",
  # Retained, and republished on every configuration change: clears the alarms of removed points.
  "te/+/+/ot/+/status/link",
]

[[steps]]
script = "main.js"
