# ot-event: OT signal -> thin-edge event
#
# Per-signal events declared on a connector point's `meta.event`, evaluated on its samples for any
# value (number, boolean, string). Inert without a declaration, so the flow ships active. The
# measurement-series event (one series, an event on every change) is the separate flow
# ot-event-series.
input.mqtt.topics = ["te/+/+/ot/+/sample/+"]

[[steps]]
script = "main.js"
